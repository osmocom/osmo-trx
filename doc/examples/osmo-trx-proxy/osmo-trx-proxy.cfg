log stderr
 logging filter all 1
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging print thread-id 0
 logging print extended-timestamp 1
 logging print level 1
 logging print file basename last
 logging level set-all notice
 logging level proxy info
 logging level trxc info
 logging level trxd notice
 logging level lglobal notice
!
proxy
 bind-addr 0.0.0.0
 clck-gen start-fn random
 clck-gen ind-period 102
 pm-rssi-noise -110
 path-loss 110
 nominal-toa256 0
 nominal-ci 90
 ep bts
  remote-addr 127.0.0.1
  base-port 5700
  num-chans 1
  tx-power 50
 ep ms
  remote-addr 127.0.0.1
  base-port 6700
  num-chans 1
  tx-power 50
  no clock-socket
